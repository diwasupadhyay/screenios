[package]
name = "screenios"
version = "0.1.0"
edition = "2021"

[dependencies]
ios-core = { path = "vendor/ios/crates/ios-core", features = ["display", "tunnel-userspace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

